<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciando Velvy Studio...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-card {
      width: 460px;
      height: 290px;
      background: radial-gradient(circle at 50% 20%, #1e0d3d 0%, #0c051a 80%);
      border: 1px solid #6b21a8;
      border-radius: 22px;
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.45), 0 20px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      position: relative;
    }
    .logo-glow {
      position: relative;
      margin-bottom: 16px;
    }
    .logo-img {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      animation: floatPulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes floatPulse {
      0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 15px rgba(155,67,255,0.4)); }
      100% { transform: translateY(-4px) scale(1.04); filter: drop-shadow(0 0 25px rgba(192,132,252,0.7)); }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #fff 20%, #d8b4fe 70%, #9b43ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 11px;
      color: #9482b3;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    .progress-track {
      width: 82%;
      height: 6px;
      background: #090314;
      border: 1px solid #36175e;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #d946ef, #38bdf8);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(155, 67, 255, 0.9);
      transition: width 0.35s ease;
    }
    .status-text {
      font-size: 11px;
      color: #c084fc;
      font-family: monospace;
      letter-spacing: 0.3px;
      min-height: 16px;
    }
    .version-tag {
      position: absolute;
      bottom: 12px;
      right: 18px;
      font-size: 10px;
      color: #624b82;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-glow">
      <img src="assets/logo.png" alt="Velvy Logo" class="logo-img">
    </div>
    <h1>VELVY STUDIO PRO</h1>
    <p class="subtitle">Suíte de Automação Inteligente de Vídeo & IA</p>
    
    <div class="progress-track">
      <div class="progress-fill" id="pfill"></div>
    </div>
    <div class="status-text" id="status">Iniciando sistema...</div>

    <div class="version-tag" id="vtag">v1.0.0</div>
  </div>

  <script>
    const fill = document.getElementById('pfill');
    const status = document.getElementById('status');
    const steps = [
      { p: 20, text: 'Iniciando servidor local dedicado...' },
      { p: 45, text: 'Verificando integridade e licença...' },
      { p: 75, text: 'Carregando módulos da Suíte Velvy...' },
      { p: 95, text: 'Finalizando interface...' },
      { p: 100, text: 'Pronto!' }
    ];

    let current = 0;
    function advance() {
      if (current < steps.length) {
        fill.style.width = steps[current].p + '%';
        status.textContent = steps[current].text;
        current++;
        setTimeout(advance, 260);
      }
    }
    setTimeout(advance, 150);
  </script>
</body>
</html>
